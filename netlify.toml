# Configuration Netlify pour le site AERD/UAM
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Redirection pour le site : toutes les pages passent par index.html
# (les fonctions /.netlify/functions/* restent accessibles, elles sont servies avant)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
